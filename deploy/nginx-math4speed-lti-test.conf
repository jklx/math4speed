server {
    listen 80;
    server_name lti-test.m4s.waldmueller.eu;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lti-test.m4s.waldmueller.eu;

    # Provision this certificate with Certbot before enabling this server block.
    ssl_certificate /etc/letsencrypt/live/lti-test.m4s.waldmueller.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lti-test.m4s.waldmueller.eu/privkey.pem;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
