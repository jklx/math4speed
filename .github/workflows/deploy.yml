name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      INSTANCE: ${{ vars.GCE_INSTANCE }}
      ZONE: ${{ vars.GCE_ZONE }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Validate deployment settings
        shell: bash
        run: |
          for value in "$PROJECT_ID" "$REGION" "$REPOSITORY" "$INSTANCE" "$ZONE"; do
            test -n "$value" || { echo "A required production variable is missing." >&2; exit 1; }
          done

      - name: Build and publish image
        shell: bash
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/math4speed:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Copy and run deployment script
        shell: bash
        run: |
          IAP_FLAG=()
          if [[ "${{ vars.GCE_USE_IAP }}" == "true" ]]; then
            IAP_FLAG=(--tunnel-through-iap)
          fi
          gcloud compute scp deploy/remote-deploy.sh "${INSTANCE}:/tmp/math4speed-deploy.sh" --zone "$ZONE" "${IAP_FLAG[@]}"
          gcloud compute ssh "$INSTANCE" --zone "$ZONE" "${IAP_FLAG[@]}" --command "sudo chmod 700 /tmp/math4speed-deploy.sh && sudo /tmp/math4speed-deploy.sh '$IMAGE_URI'"
